services:
  db:
    image: mysql:8.0
    command:
      - --innodb-use-native-aio=0
      - --innodb-flush-method=fsync
      - --socket=/var/run/mysqld/mysqld.sock
      - --pid-file=/var/run/mysqld/mysqld.pid
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - lan-mysql:/var/lib/mysql
      - mysql-run:/var/run/mysqld
    healthcheck:
      test: ["CMD", "mysqladmin", "--socket=/var/run/mysqld/mysqld.sock", "ping", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      DB_HOST: localhost
      DB_NAME: ${DB_NAME:-photo_album}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - lan-drive:/var/share/lan-drive
      - mysql-run:/var/run/mysqld
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-run:
  lan-drive:
    driver: local
    driver_opts:
      type: cifs
      device: //${SMB_HOST}/${SMB_SHARE}
      o: username=${SMB_USER},password=${SMB_PASSWORD},vers=3.0,uid=33,gid=33,file_mode=0666,dir_mode=0777,noperm,nounix,noserverino
  lan-mysql:
    driver: local
    driver_opts:
      type: cifs
      device: //${SMB_HOST}/${SMB_SHARE}/mysql
      o: username=${SMB_USER},password=${SMB_PASSWORD},vers=3.0,uid=999,gid=999,file_mode=0660,dir_mode=0770,noperm,nounix,noserverino,nobrl
