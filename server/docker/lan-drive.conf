Timeout 600
LimitRequestBody 0
AddType image/avif .avif

Alias /lan-drive /var/share/lan-drive

<Directory /var/share/lan-drive>
    Options FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<Directory /var/www/html>
    Options FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.html index.php
</Directory>
